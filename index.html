<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fce6cc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="우재와 둥">
<meta name="description" content="양우재와 둥의 소소한 하루 — 직접 돌보고, 옷을 입히고, 요리해 먹이는 아늑한 육성 게임">
<link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css?v=5.3">
<title>양우재와 둥의 소소한 하루 · v5.3</title>
</head>
<body>
<div class="app" id="app">
 <header class="topbar">
  <button type="button" class="logo" data-view="home" title="우리 집으로"><img src="assets/characters/expressions/happy.png" alt=""><span>양우재와 둥의<em>소소한 하루</em></span><i>♡</i></button>
  <div class="top-info"><span>☀ <b id="topDay">1일차</b></span><span id="topClock">오전 09:00</span><span>🟡 <b id="topCoins">350</b></span></div>
  <div class="top-actions"><span class="save-mark" id="saveMark">● 자동 저장</span><button type="button" id="quickBackup" class="small-action">백업</button></div>
 </header>
 <nav class="tabs" id="tabs" aria-label="화면 선택">
  <button type="button" data-view="home" class="tab active"><span>⌂</span>우리 집</button>
  <button type="button" data-view="closet" class="tab"><span>👕</span>옷장</button>
  <button type="button" data-view="bath" class="tab"><span>🛁</span>목욕</button>
  <button type="button" data-view="sleep" class="tab"><span>☾</span>재우기</button>
  <button type="button" data-view="cook" class="tab"><span>♨</span>요리</button>
  <button type="button" data-view="feed" class="tab"><span>♡</span>식사</button>
  <button type="button" data-view="shop" class="tab"><span>◈</span>상점</button>
  <button type="button" data-view="diary" class="tab"><span>✎</span>일기장</button>
  <button type="button" data-view="settings" class="tab"><span>⚙</span>설정</button>
 </nav>
 <main id="main" class="main" tabindex="-1"></main>
 <footer class="footer"><span>음악 없는 조용한 하루 · 모든 동작은 터치와 마우스로 즐기실 수 있습니다.</span><span>저장 데이터는 이 브라우저에 보관됩니다. 중요한 기록은 백업해 주세요.</span></footer>
</div>
<div class="effects" id="effects" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog id="dialog" class="dialog"><div id="dialogContent"></div><button class="dialog-close" id="dialogClose" type="button">닫기</button></dialog>
<script src="game.js?v=5.3" defer></script>
</body>
</html>
